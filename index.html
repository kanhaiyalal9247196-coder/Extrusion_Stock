$('#lf').onsubmit=e=>{e.preventDefault();const u=db.users.find(x=>x.name==e.target.elements.u.value&&x.pass==e.target.elements.p.value);if(!u)return alert('Wrong user name or password.');me={name:u.name,role:u.role};localStorage.setItem('alufab_sess',JSON.stringify({...me,date:today()}));go('dash')}}

const lastOut=c=>db.sout.filter(x=>x.code==c).map(x=>x.date).sort().pop()||'',dead=(c,d)=>{const l=lastOut(c);return !l||(Date.now()-new Date(l))/864e5>d},used=c=>sum(db.sout.filter(x=>x.code==c),x=>x.qty);
const kp=a=>`<div class=kp>${a.map(k=>`<div><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>`,mini=(h,r)=>`<div class=tw style="max-height:300px"><table><tr>${h.map(x=>`<th>${x}`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}`).join('')}</tr>`).join('')||'<tr><td>No data</td></tr>'}</table></div>`;
function autoBk(){try{if(db.set.autoBackup=='YES'&&db.set.lastBackup!=today())bk()}catch(e){}}
function dash(){const it=db.items,td=today(),low=it.filter(i=>stt(i.code)!='OK'),ro=it.filter(i=>db.set.reorder+db.set.safety-cur(i.code)-pend(i.code)>0),dd=it.filter(i=>dead(i.code,180)),ti=sum(db.sin.filter(x=>x.date==td),x=>x.qty)+sum(db.mr.filter(x=>x.date==td),x=>x.qty),to=sum(db.sout.filter(x=>x.date==td),x=>x.qty),pp=sum(it,i=>pend(i.code)),now=new Date().toLocaleString();
return `<div class=ph><h2>ALU FAB ERP v2.0 - Professional dashboard</h2><small>Live inventory, purchase and management overview | ${now}</small></div>`+kp([['Total items',it.length],['Current stock',sum(it,i=>cur(i.code))],['Pending PO',pp],['Future stock',sum(it,i=>cur(i.code)+pend(i.code))],['Low stock',low.length],['Dead stock',dd.length],['Reorder items',ro.length],['Today inward',ti],['Today outward',to]])+`
<div class=g2><div class=card><h3>Low stock alert</h3>${mini(['Item code','Description','Stock'],low.slice(0,8).map(i=>[E(i.code),E(i.desc),cur(i.code)]))}</div><div class=card><h3>Purchase / reorder alert</h3>${mini(['Item code','Description','Future stock','Action'],ro.slice(0,8).map(i=>[E(i.code),E(i.desc),cur(i.code)+pend(i.code),'<span class="pill wn">ORDER</span>']))}</div>
<div class=card><h3>Today activity</h3>${mini(['Activity','Qty'],[['Inward',ti],['Outward',to],['Pending PO',pp]])}</div><div class=card><h3>ERP health</h3>${mini(['Check','Value'],[['Inventory health',Math.round(100*(it.length-low.length)/(it.length||1))+'%'],['Low stock items',low.length],['Dead stock items',dd.length]])}</div>
<div class=card><h3>ERP status</h3>${mini(['Field','Value'],[['Status','ONLINE'],['Version','ERP '+db.set.version],['Last refresh',now],['User',E(me.name)+' ('+me.role+')'],['Last backup',db.set.lastBackup||'-']])}</div></div>`}
function repHome(){const it=db.items,G3=[['Inventory reports',['Stock Master','Inward','Outward','Stock Ledger']],['Purchase reports',['Pending PO','Material Received','Purchase Plan','Open PO']],['Management reports',['Critical Stock','Low Stock','Safe Stock','Dead Stock']]];
return `<div class=ph><h2>Report center</h2><small>Open a report, then export it to PDF or Excel</small></div>`+kp([['Total items',it.length],['Current stock',sum(it,i=>cur(i.code))],['Pending PO',sum(it,i=>pend(i.code))],['Total inward',sum(db.sin,x=>x.qty)+sum(db.mr,x=>x.qty)],['Total outward',sum(db.sout,x=>x.qty)],['Critical items',it.filter(i=>stt(i.code)=='CRITICAL').length],['Last backup',db.set.lastBackup||'-'],['Last PDF export',db.set.lastPdf||'-'],['ERP version',db.set.version]])+G3.map(g=>`<div class=card style="margin-top:14px"><h3>${g[0]}</h3><div class=tg>${g[1].map(n=>`<button class=tile onclick="S.rep='${n}';S.f.rep={};go('rep')">${n}</button>`).join('')}</div></div>`).join('')}
function mgmt(){const f=S.f.mgmt,q=(f.q||'').toLowerCase(),it=db.items.filter(i=>(!q||(i.code+' '+i.desc).toLowerCase().includes(q))&&(!f.st||stt(i.code)==f.st)),inR=x=>(!f.from||x.date>=f.from)&&(!f.to||x.date<=f.to),uR=c=>sum(db.sout.filter(x=>x.code==c&&inR(x)),x=>x.qty),
U=it.map(i=>({i,u:uR(i.code),l:lastOut(i.code)})),fast=U.filter(x=>x.u>0).sort((a,b)=>b.u-a.u).slice(0,10),slow=U.filter(x=>x.u>0).sort((a,b)=>a.u-b.u).slice(0,10),r=(a,g)=>a.map(x=>[E(x.i.code),E(x.i.desc),...g(x)]),d6=U.filter(x=>dead(x.i.code,180)).slice(0,15),d12=U.filter(x=>dead(x.i.code,365)).slice(0,15),tot=sum(U,x=>val(x.i.code,x.u));let c=0;
const abc=[...U].filter(x=>x.u>0).sort((a,b)=>val(b.i.code,b.u)-val(a.i.code,a.u)).slice(0,15).map(x=>{c+=val(x.i.code,x.u);const p=tot?c/tot:1;return[E(x.i.code),E(x.i.desc),val(x.i.code,x.u),p<=.8?'A':p<=.95?'B':'C']});
const bar=`<div class="bar card">From <input type=date value="${f.from||''}" onchange="mf('from',this.value)"> To <input type=date value="${f.to||''}" onchange="mf('to',this.value)"><input placeholder="Item code or description" value="${E(f.q||'')}" onchange="mf('q',this.value)"><select onchange="mf('st',this.value)"><option value="">Status: all</option>${['CRITICAL','ORDER REQUIRED','LOW STOCK','OK'].map(s=>`<option${f.st==s?' selected':''}>${s}</option>`).join('')}</select><button class=g onclick="S.f.mgmt={from:'',to:''};go('mgmt')">Clear</button></div>`;
return `<div class=ph><h2>Management analysis v2.0</h2><small>Consumption is based on outward entries between the selected dates. Dead stock uses the full history.</small></div>`+bar+kp([['Items shown',it.length],['Current stock',sum(it,i=>cur(i.code))],['Outward (selected dates)',sum(U,x=>x.u)],['Critical items',it.filter(i=>stt(i.code)=='CRITICAL').length],['Pending PO',sum(it,i=>pend(i.code))],['Dead stock',it.filter(i=>dead(i.code,180)).length],['Reorder items',it.filter(i=>db.set.reorder+db.set.safety-cur(i.code)-pend(i.code)>0).length],['Analysis date',today()]])+
`<div class=g2><div class=card><h3>Top 10 fast moving material</h3>${mini(['Item code','Description','Qty used'],r(fast,x=>[x.u]))}</div><div class=card><h3>Top 10 slow moving material</h3>${mini(['Item code','Description','Qty used'],r(slow,x=>[x.u]))}</div><div class=card><h3>Top 15 dead stock - 6 months</h3>${mini(['Item code','Description','Last used','Current'],r(d6,x=>[x.l||'NEVER USED',cur(x.i.code)]))}</div><div class=card><h3>Top 15 no movement - 12 months</h3>${mini(['Item code','Description','Last used','Current'],r(d12,x=>[x.l||'NEVER USED',cur(x.i.code)]))}</div><div class=card><h3>ABC analysis (by consumption value)</h3>${mini(['Item code','Description','Value','Class'],abc)}</div></div>`}
const mf=(k,v)=>{S.f.mgmt[k]=v;go('mgmt')};
const SF=[['company','Company name'],['critical','Critical stock','n'],['reorder','Reorder level','n'],['safety','Safety stock','n'],['avgDays','Average consumption days','n'],['unit','Default unit'],['stockIn','Inward allowed','y'],['stockOut','Outward allowed','y'],['mrAllowed','Material receive allowed','y'],['auditLog','Audit log enable','y'],['dupInvoice','Duplicate invoice check','y'],['dupPO','Duplicate PO check','y'],['allowExtra','Allow extra qty','y'],['allowShort','Allow short close','y'],['autoBackup','Auto backup (daily download)','y']];
const sets=()=>`<div class=ph><h2>Settings</h2><small>ERP ${db.set.version}</small></div><form class=card onsubmit="return ss(event)"><div class=g2 style="margin:0 0 12px">${SF.map(([k,l,t])=>`<label>${l}${t=='y'?`<select name=${k}>${['YES','NO'].map(o=>`<option${db.set[k]==o?' selected':''}>${o}</option>`).join('')}</select>`:`<input name=${k} ${t=='n'?'type=number min=0':''} value="${E(db.set[k])}">`}</label>`).join('')}</div><p>Last backup: ${db.set.lastBackup||'-'}</p><button>Save settings</button> <button type=button class=g onclick=bk()>Backup now</button> <label style="display:inline-grid">Restore from backup<input type=file accept=.json onchange="rstr(this.files[0])"></label></form>`;
function ss(e){e.preventDefault();SF.forEach(([k,l,t])=>{const v=e.target.elements[k].value;db.set[k]=t=='n'?+v||0:v});lg('EDIT','Settings');toast('Settings saved');go('set');return false}
function srch(){return `<div class=ph><h2>Universal search</h2><small>Search items, POs, invoices and ledger IDs</small></div><div class="bar card"><select id=sb>${['Item code','Description','PO number','Material invoice','Ledger ID'].map(o=>`<option>${o}</option>`).join('')}</select><input id=sq style="min-width:240px" placeholder="Type to search" onkeydown="event.key=='Enter'&&doS()"><button onclick=doS()>Search</button><button class=g onclick="go('search')">Clear</button></div><div id=sr></div>`}
function doS(){const by=$('#sb').value,q=$('#sq').value.trim().toLowerCase();if(!q)return;const m=s=>String(s??'').toLowerCase().includes(q),D=c=>item(c)?.desc||'',R=[];
const ok=x=>by=='Item code'?m(x.code):by=='Description'?m(D(x.code)):by=='PO number'?m(x.po):by=='Material invoice'?m(x.inv):by=='Ledger ID'?m(LID[x.id]):0;
db.items.forEach(i=>{if(by=='Item code'?m(i.code):by=='Description'?m(i.desc):0)R.push(['','STOCK MASTER',i.code,i.desc,cur(i.code),'','',''])});
db.sin.forEach(x=>ok(x)&&R.push([x.date,'INWARD',x.code,D(x.code),x.qty,'','',x.remark]));db.sout.forEach(x=>ok(x)&&R.push([x.date,'OUTWARD',x.code,D(x.code),x.qty,'','',x.used]));
db.po.forEach(x=>by!='Ledger ID'&&ok(x)&&R.push([x.date,'PO ORDER',x.code,D(x.code),x.qty,x.po,'','']));db.mr.forEach(x=>ok(x)&&R.push([x.date,'MATERIAL RECEIVED',x.code,D(x.code),x.qty,x.po,x.inv,x.remark]));
const L=txns();L.forEach(x=>(by=='Ledger ID'?m(x.tid):0)&&R.push([x.date,'STOCK LEDGER',x.code,x.desc,x.in||x.out,x.po,x.inv,x.remark]));
const c=R[0]?.[2],sm=c&&item(c)?(l=>`<div class=card><h3>${E(c)} - ${E(D(c))}</h3>${kp([['Current stock',cur(c)],['Pending PO',pend(c)],['Status',stH({st:stt(c)})],['Total inward',sum(db.sin.filter(x=>x.code==c),x=>x.qty)+sum(db.mr.filter(x=>x.code==c),x=>x.qty)],['Total outward',used(c)],['Last transaction',l?l.tid:'-'],['Last movement',l?l.date:'-']])}</div>`)(L.filter(x=>x.code==c).pop()):'';
$('#sr').innerHTML=sm+`<div class=card><h3>${R.length} results</h3>${mini(['Date','Source sheet','Item code','Description','Qty','PO no','Invoice no','Remark'],R.slice(0,500).map(r=>r.map(E)))}</div>`}
navigator.storage?.persist?.();
me?go('dash'):login();
</script>
